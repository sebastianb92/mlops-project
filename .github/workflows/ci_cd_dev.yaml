name: CI/CD Pipeline - DEVELOPMENT

on:
  push:
    branches:
      - dev

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: mlops-deploy-repository
  ECR_REGISTRY: 804923754854.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: dev-latest
  CLUSTER_NAME: mlops-deploy-cluster
  SERVICE_NAME: mlops-dev-service
  TASK_DEFINITION: mlops-deploy-dev:3
  SUBNETS: subnet-067b18d21d7a147a8
  S3_BUCKET: mlops-project-deploy-bucket
  TEST_FOLDER: test_data/
  MODEL_PATH: models/mobilenetv2-7.onnx

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: pip install -r requirements.txt boto3 onnxruntime pillow pytest

      - name: Ejecutar Pruebas Unitarias
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/

      - name: Test con Imágenes S3
        run: |
          python - <<EOF
import boto3
import onnxruntime as ort
import numpy as np
from PIL import Image
import io
import os

BUCKET_NAME = os.environ["S3_BUCKET"]
TEST_FOLDER = os.environ["TEST_FOLDER"]
MODEL_PATH = os.environ["MODEL_PATH"]

s3 = boto3.client("s3")

# Descargar modelo
s3.download_file(BUCKET_NAME, MODEL_PATH, "temp_model.onnx")
session = ort.InferenceSession("temp_model.onnx")

def preprocess_image(image_bytes):
    image = Image.open(io.BytesIO(image_bytes)).resize((224,224)).convert("RGB")
    np_image = np.array(image).astype("float32") / 255.0
    np_image = np_image.transpose(2,0,1)
    np_image = np.expand_dims(np_image,0)
    return np_image

# Listar imágenes
response = s3.list_objects_v2(Bucket=BUCKET_NAME, Prefix=TEST_FOLDER)
test_images = [obj['Key'] for obj in response.get('Contents', []) if obj['Key'].lower().endswith(('.jpg','.png','.jpeg'))]

# Ejecutar pruebas
for img_name in test_images:
    obj = s3.get_object(Bucket=BUCKET_NAME, Key=img_name)
    input_tensor = preprocess_image(obj['Body'].read())
    outputs = session.run(None, {"input": input_tensor})
    assert outputs is not None, f"Fallo en {img_name}"

print("Tests S3 completados correctamente")
EOF

  build_promote:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Construir y Push Docker Image
        run: |
          DOCKER_IMAGE_TAG=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker build . -t $DOCKER_IMAGE_TAG
          docker push $DOCKER_IMAGE_TAG

      - name: Crear o Actualizar ECS Service
        run: |
          SERVICE_EXISTS=$(aws ecs describe-services \
            --cluster ${{ env.CLUSTER_NAME }} \
            --services ${{ env.SERVICE_NAME }} \
            --query 'services[0].status' --output text)

          if [ "$SERVICE_EXISTS" = "ACTIVE" ]; then
            aws ecs update-service \
              --cluster ${{ env.CLUSTER_NAME }} \
              --service ${{ env.SERVICE_NAME }} \
              --force-new-deployment
          else
            aws ecs create-service \
              --cluster ${{ env.CLUSTER_NAME }} \
              --service-name ${{ env.SERVICE_NAME }} \
              --task-definition ${{ env.TASK_DEFINITION }} \
              --launch-type FARGATE \
              --desired-count 1 \
              --network-configuration "awsvpcConfiguration={subnets=[${{ env.SUBNETS }}],assignPublicIp=ENABLED}"
